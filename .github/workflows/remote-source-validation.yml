name: Validate remote source spec

on:
  workflow_call:
    inputs:
      schema_path:
        description: Path to the validation schema file
        required: false
        type: string
        default: spec/2026-03-05.json5
      target_path:
        description: Directory containing remote source spec JSON files
        required: false
        type: string
        default: remote-source/spec
    outputs:
      validation_result:
        value: ${{ jobs.validate.outputs.validation_result }}
      files_checked:
        value: ${{ jobs.validate.outputs.files_checked }}
      invalid_files:
        value: ${{ jobs.validate.outputs.invalid_files }}
      report_json:
        value: ${{ jobs.validate.outputs.report_json }}
  workflow_dispatch:
    inputs:
      schema_path:
        description: Path to the validation schema file
        required: false
        type: string
        default: spec/2026-03-05.json5
      target_path:
        description: Directory containing remote source spec JSON files
        required: false
        type: string
        default: remote-source/spec

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      validation_result: ${{ steps.report.outputs.validation_result }}
      files_checked: ${{ steps.report.outputs.files_checked }}
      invalid_files: ${{ steps.report.outputs.invalid_files }}
      report_json: ${{ steps.report.outputs.report_json }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate remote source spec
        id: validate
        continue-on-error: true
        run: |
          node scripts/validate-prepr-remote-source.mjs \
            --schema "${{ inputs.schema_path }}" \
            --target "${{ inputs.target_path }}" \
            --report-file report.json

      - name: Read validation report
        id: report
        if: always()
        shell: bash
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          if [ -f report.json ]; then
            node --input-type=module -e '
              import fs from "node:fs";

              const report = JSON.parse(fs.readFileSync("report.json", "utf8"));
              const output = process.env.GITHUB_OUTPUT;
              const escapeValue = (value) => String(value)
                .replace(/%/g, "%25")
                .replace(/\r/g, "%0D")
                .replace(/\n/g, "%0A");

              fs.appendFileSync(output, `validation_result=${report.isValid ? "success" : "failure"}\n`);
              fs.appendFileSync(output, `files_checked=${report.filesChecked ?? 0}\n`);
              fs.appendFileSync(output, `invalid_files=${report.invalidFiles?.length ?? 0}\n`);
              fs.appendFileSync(output, `report_json=${escapeValue(JSON.stringify(report))}\n`);
            '
            exit 0
          fi

          validation_result="failure"
          if [ "$VALIDATE_OUTCOME" = "success" ]; then
            validation_result="success"
          fi

          {
            echo "validation_result=$validation_result"
            echo "files_checked=0"
            echo "invalid_files=0"
            echo 'report_json={"isValid":false,"filesChecked":0,"invalidFiles":[],"note":"report.json was not generated"}'
          } >> "$GITHUB_OUTPUT"

      - name: Fail when validation fails
        if: steps.report.outputs.validation_result == 'failure'
        run: exit 1
